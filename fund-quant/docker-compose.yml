services:
  fund-quant:
    build:
      context: .
    container_name: fund-quant
    environment:
      FUND_QUANT_ENVIRONMENT: dev
      FUND_QUANT_HOST: 0.0.0.0
      FUND_QUANT_PORT: 8000
      FUND_QUANT_REDIS_URL: redis://redis:6379/1
      FUND_QUANT_MARKET_CACHE_SECONDS: 15
      FUND_QUANT_HOLDING_CACHE_SECONDS: 21600
      FUND_QUANT_NAV_CACHE_SECONDS: 1800
      FUND_QUANT_FUND_CACHE_SECONDS: 21600
      FUND_QUANT_ESTIMATE_CACHE_SECONDS: 15
      FUND_QUANT_UPSTREAM_MAX_RETRIES: 2
      FUND_QUANT_UPSTREAM_RETRY_BASE_SECONDS: 0.5
      FUND_QUANT_UPSTREAM_RETRY_AFTER_SECONDS: 30
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8
    container_name: fund-quant-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - fund-quant-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  fund-quant-redis-data:
